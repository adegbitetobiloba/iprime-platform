# Frontend deploy (Netlify). The frontend lives in /frontend (Vite + React Router).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for every route so deep links (/login, /student, /cbt ...) work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Set VITE_API_URL in Netlify > Site configuration > Environment variables (the public API URL only; never secrets).
