<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04204F" />
    <meta name="description" content="iPrime is the digital platform of Prime Excelerate Tutelage: academic excellence, examination preparation, learning resources and computer-based practice." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <!-- Sets the colour theme before the first paint so there is no white flash. Same key and rules as src/theme.js. -->
    <script>
      (function () {
        try {
          var d = document.documentElement, t = null;
          try { t = localStorage.getItem("iprime-theme"); } catch (e) {}
          if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          d.setAttribute("data-theme", t);
          d.setAttribute("data-v2", "");
        } catch (e) {}
      })();
    </script>
    <title>iPrime | Prime Excelerate Tutelage</title>
  </head>
  <body>
    <!-- Shown while the app downloads (slow networks, modest phones); React replaces it as soon as it starts. -->
    <div id="root"><p style="font-family:system-ui,sans-serif;text-align:center;margin:3rem 1rem;color:#44506a">Loading iPrime&hellip;</p></div>
    <noscript><p style="font-family:system-ui,sans-serif;text-align:center;margin:2rem 1rem;color:#9b1c11">iPrime needs JavaScript. Please turn it on in your browser settings and reload the page.</p></noscript>
    <!-- Browsers too old to run modules ignore the app below and run this instead. Written in plain old JavaScript on purpose. -->
    <script nomodule>
      document.getElementById("root").innerHTML = '<div style="font-family:Arial,sans-serif;max-width:30rem;margin:2rem auto;padding:0 1rem;color:#1b2640;line-height:1.5"><h1 style="font-size:1.4rem;color:#04204f">Please update your browser</h1><p>This browser is too old to run iPrime. Please update it, or open this page in the latest Chrome, Firefox, Edge or Safari. If you need help, contact Prime Excelerate Tutelage.</p></div>';
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
