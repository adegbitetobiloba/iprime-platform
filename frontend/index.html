<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04204F" />
    <meta name="description" content="iPrime is the digital platform of Prime Excelerate Tutelage: academic excellence, examination preparation, learning resources and computer-based practice." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <!-- Sets the colour theme before the first paint so there is no white flash. Same key and rules as src/theme.js. -->
    <script>
      (function () {
        try {
          var d = document.documentElement, t = null;
          try { t = localStorage.getItem("iprime-theme"); } catch (e) {}
          if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          d.setAttribute("data-theme", t);
          d.setAttribute("data-v2", "");
        } catch (e) {}
      })();
    </script>
    <title>iPrime | Prime Excelerate Tutelage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
