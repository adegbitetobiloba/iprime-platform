# Render Blueprint for the iPrime backend. Secrets are NOT stored here: values marked sync:false are entered in the Render dashboard.
services:
  - type: web
    name: iprime-api
    runtime: node
    region: frankfurt          # nearest Render region to Nigeria; change if you prefer
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node app.js
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
